name: ✨ Feature request
description: Suggest an idea for ReplyDNA
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve for creators?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Voice DNA, Replies / inbox, Scam shield, Mentions radar, Reports, Setup, Other]
